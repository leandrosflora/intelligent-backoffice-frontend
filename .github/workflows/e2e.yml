name: Cross-repository E2E

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-case:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: intelligent-backoffice-frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/backoffice-platform-api
          path: backoffice-platform-api

      - name: Checkout architecture
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/intelligent-backoffice-platform-architecture
          path: intelligent-backoffice-platform-architecture

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: intelligent-backoffice-frontend/intelligent-backoffice-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: intelligent-backoffice-frontend/intelligent-backoffice-frontend
        run: npm ci

      - name: Install Chromium
        working-directory: intelligent-backoffice-frontend/intelligent-backoffice-frontend
        run: npx playwright install --with-deps chromium

      - name: Start integrated runtime
        run: docker compose -f intelligent-backoffice-frontend/e2e/docker-compose.yml up -d --build --wait --wait-timeout 240

      - name: Run governed-case journey
        working-directory: intelligent-backoffice-frontend/intelligent-backoffice-frontend
        run: npm run test:e2e

      - name: Capture runtime logs
        if: failure()
        run: docker compose -f intelligent-backoffice-frontend/e2e/docker-compose.yml logs --no-color

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: intelligent-backoffice-frontend/intelligent-backoffice-frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop integrated runtime
        if: always()
        run: docker compose -f intelligent-backoffice-frontend/e2e/docker-compose.yml down --volumes --remove-orphans
